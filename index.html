<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Namori 老师「绘日记」插画浏览、搜索、整理与临摹辅助" />
    <title>绘日记 · Namori Diary</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23b0553b'/%3E%3Ctext x='50' y='68' font-size='54' text-anchor='middle' fill='%23fff8ec' font-family='serif'%3E绘%3C/text%3E%3C/svg%3E" />
    <script>
      // 提前应用主题，避免首屏闪白；未保存偏好的访客默认暗色
      try {
        var t = 'dark'
        var saved = localStorage.getItem('namori.theme')
        if (saved === 'light' || saved === 'dark') t = saved
        document.documentElement.dataset.theme = t
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
