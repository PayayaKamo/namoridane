<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Namori 老师「水母绘日记」插画浏览、搜索、整理与临摹辅助" />
    <title>水母绘日记 · Namori Diary</title>
    <link rel="icon" type="image/webp" href="./namori_icon.webp" />
    <link rel="icon" type="image/png" sizes="32x32" href="./namori_icon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="./namori_icon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./namori_icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./namori_icon-180.png" />
    <link rel="shortcut icon" href="./namori_icon.ico" />
    <script>
      // 提前应用主题，避免首屏闪白；未保存偏好的访客默认暗色
      try {
        var t = 'dark'
        var saved = localStorage.getItem('namori.theme')
        if (saved === 'light' || saved === 'dark') t = saved
        document.documentElement.dataset.theme = t
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
